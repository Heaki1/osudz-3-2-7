name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck client and server
        run: pnpm exec tsc --noEmit

      - name: Typecheck server
        run: pnpm --dir server exec tsc --noEmit

      - name: Client tests
        run: pnpm test:client

      - name: Server tests
        run: pnpm test:server

      - name: Production build
        run: pnpm run build
